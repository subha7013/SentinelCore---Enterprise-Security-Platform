server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sentinelcore-lyart.vercel.app,http://localhost:5173,http://localhost:3000}

sentinel:
  admin:
    name: ${SENTINEL_ADMIN_NAME:Admin}
    email: ${SENTINEL_ADMIN_EMAIL:admin@sc.in}
    password: ${SENTINEL_ADMIN_PASSWORD:Admin@123}
    department: ${SENTINEL_ADMIN_DEPARTMENT:Security Operations}
